name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-landing
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set tag
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.REGISTRY_USER }}
          password: ${{ secrets.REGISTRY_PAT }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ secrets.REGISTRY_USER }}/landing-app:${{ env.TAG }}
            ${{ secrets.REGISTRY_USER }}/landing-app:latest
          build-args: |
            VITE_POCKETBASE_URL=${{ vars.VITE_POCKETBASE_URL }}
            VITE_MEDIA_BASE_URL=${{ vars.VITE_MEDIA_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Kirim file deploy
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          source: deploy/docker-compose.yml,deploy/remote-deploy.sh,deploy/nginx
          target: ${{ vars.DEPLOY_PATH }}/landing
          strip_components: 1

      - name: Deploy to VPS via SSH
        uses: appleboy/ssh-action@v1.0.3
        env:
          STACK_PATH: ${{ vars.DEPLOY_PATH }}/landing
          ENV_FILE: ${{ secrets.ENV_FILE_LANDING }}
          REGISTRY_USER: ${{ secrets.REGISTRY_USER }}
          REGISTRY_PAT: ${{ secrets.REGISTRY_PAT }}
          TAG: ${{ env.TAG }}
        with:
          host: ${{ secrets.SSH_HOST }}
          username: ${{ secrets.SSH_USER }}
          key: ${{ secrets.SSH_KEY }}
          port: ${{ secrets.SSH_PORT }}
          envs: STACK_PATH,ENV_FILE,REGISTRY_USER,REGISTRY_PAT,TAG
          script_stop: true
          script: |
            umask 077
            cd "$STACK_PATH"
            # .env dari secret GitHub; skrip deploy menggantikan .env lama setelah membaca tag lama.
            printf '%s\n' "$ENV_FILE" > .env.new
            bash remote-deploy.sh "$TAG"

      - name: Smoke test
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "https://$DOMAIN/" > /dev/null
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "https://www.$DOMAIN/" > /dev/null
