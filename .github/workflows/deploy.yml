name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy-production-landing
  cancel-in-progress: false

permissions:
  contents: read
  packages: write

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/landing-page

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment: production
    steps:
      - uses: actions/checkout@v4

      - name: Set tag
        run: echo "TAG=sha-${GITHUB_SHA::7}" >> "$GITHUB_ENV"

      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ${{ env.IMAGE }}:${{ env.TAG }}
            ${{ env.IMAGE }}:latest
          build-args: |
            VITE_POCKETBASE_URL=${{ vars.VITE_POCKETBASE_URL }}
            VITE_MEDIA_BASE_URL=${{ vars.VITE_MEDIA_BASE_URL }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Setup SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SSH_KNOWN_HOSTS: ${{ secrets.SSH_KNOWN_HOSTS }}
        run: |
          mkdir -p ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts

      - name: Sync compose
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
        run: |
          ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" "mkdir -p '$DEPLOY_PATH/landing'"
          rsync -az --delete -e "ssh -p $SSH_PORT" deploy/docker-compose.yml deploy/nginx "$SSH_USER@$SSH_HOST:$DEPLOY_PATH/landing/"

      - name: Tulis .env dari secret
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          ENV_FILE: ${{ secrets.ENV_FILE }}
        run: |
          # Ditulis ke .env.new (chmod 600); skrip deploy mengganti .env setelah membaca tag lama.
          printf '%s\n' "$ENV_FILE" | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "umask 077; mkdir -p '$DEPLOY_PATH/landing' && cat > '$DEPLOY_PATH/landing/.env.new'"

      - name: Deploy
        env:
          SSH_HOST: ${{ secrets.SSH_HOST }}
          SSH_PORT: ${{ secrets.SSH_PORT }}
          SSH_USER: ${{ secrets.SSH_USER }}
          DEPLOY_PATH: ${{ vars.DEPLOY_PATH }}
          GHCR_USER: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | ssh -p "$SSH_PORT" "$SSH_USER@$SSH_HOST" \
            "DEPLOY_PATH='$DEPLOY_PATH/landing' GHCR_USER='$GHCR_USER' NEW_TAG='$TAG' bash -s" <<'REMOTE'
          set -euo pipefail
          cd "$DEPLOY_PATH"
          docker network inspect pos_network >/dev/null 2>&1 || docker network create pos_network
          docker login ghcr.io -u "$GHCR_USER" --password-stdin
          OLD_TAG=$(grep -E '^LANDING_TAG=' .env | tail -1 | cut -d= -f2- || true)
          OLD_TAG=${OLD_TAG:-latest}
          if [ -f .env.new ]; then
            [ -f .env ] && cp -f .env .env.prev
            mv -f .env.new .env
          fi
          set_tag() {
            if grep -qE '^LANDING_TAG=' .env; then sed -i "s|^LANDING_TAG=.*|LANDING_TAG=$1|" .env
            else echo "LANDING_TAG=$1" >> .env; fi
          }
          rollback() {
            echo "Deploy landing gagal, rollback ke $OLD_TAG"
            set_tag "$OLD_TAG"
            docker compose up -d || true
            exit 1
          }
          set_tag "$NEW_TAG"
          docker compose pull landing
          docker compose up -d --remove-orphans || rollback
          ok=0
          for _ in $(seq 1 18); do
            [ "$(docker inspect -f '{{.State.Health.Status}}' pos_landing 2>/dev/null)" = healthy ] && { ok=1; break; }
            sleep 5
          done
          [ "$ok" = 1 ] || rollback
          docker compose exec -T landing-web nginx -t || rollback
          docker image prune -f
          REMOTE

      - name: Smoke test
        env:
          DOMAIN: ${{ vars.DOMAIN }}
        run: |
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "https://$DOMAIN/" > /dev/null
          curl -fsS --retry 10 --retry-delay 5 --retry-all-errors "https://www.$DOMAIN/" > /dev/null
