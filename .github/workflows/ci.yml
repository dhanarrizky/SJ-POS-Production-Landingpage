name: CI

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          build-args: |
            VITE_POCKETBASE_URL=
            VITE_MEDIA_BASE_URL=/media
          cache-from: type=gha
          cache-to: type=gha,mode=max
