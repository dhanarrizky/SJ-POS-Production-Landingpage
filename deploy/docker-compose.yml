# Landing page (PocketBase + React statis). Disinkron CI ke DEPLOY_PATH/landing.
# Tidak membuka port; nginx (repo infra) mem-proxy spontanjualan.id -> landing:8080 lewat pos_network.
services:
  landing:
    image: ghcr.io/${GHCR_OWNER:?GHCR_OWNER must be set}/landing-page:${LANDING_TAG:-latest}
    container_name: pos_landing
    restart: unless-stopped
    environment:
      PORT: 8080
    volumes:
      - landing_pb_data:/pb/pb_data
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1:8080/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    networks:
      - pos_network

volumes:
  landing_pb_data:

networks:
  # Dibuat sekali di server: docker network create pos_network
  pos_network:
    external: true
